# Render Blueprint: https://render.com/docs/blueprint-spec
# Render: New > Blueprint > pick this repository. When asked, paste the Neon
# connection string into DATABASE_URL.
services:
  - type: web
    name: ieee-tems
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_TOKEN
        generateValue: true
